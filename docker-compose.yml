services:
  php:
    build: .
    container_name: backtest_nqh_php
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www
    working_dir: /var/www
    # No local db service — this site shares the notquitehuman.new stack's
    # MariaDB server (nqh_db), in its own schema/user, reached via the
    # host's already-published 3306 rather than a second DB container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: notquitehuman_backtest
      DB_USER: backtest
      # Set BACKTEST_DB_PASS in your shell or an uncommitted .env override —
      # never commit the real value here.
      DB_PASS: "${BACKTEST_DB_PASS:?set BACKTEST_DB_PASS before starting}"

  nginx:
    image: nginx:latest
    container_name: backtest_nqh_nginx
    ports:
      - "9091:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
